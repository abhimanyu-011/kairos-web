<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kairos</title>
<meta name="description" content="Kairos - an AI assistant created by Abhimanyu.">
<meta name="theme-color" content="#09090f">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:image" content="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090f; --bg-glow: rgba(124, 58, 237, .18); --surface: #12121b; --surface-2: #181824; --hover: #1f1f2e;
    --text: #ececf4; --text-2: #a3a3b8; --text-3: #6e6e86; --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.14);
    --primary: #8b5cf6; --primary-2: #06b6d4; --on-primary: #fff; --user: #1d1b2e; --code: #0b0b12; --code-head: #14141e;
    --ok: #22c55e; --warn: #f59e0b; --danger: #ef4444; --danger-bg: rgba(239,68,68,.1);
    --shadow: 0 10px 40px rgba(0,0,0,.45); --ring: 0 0 0 3px rgba(139,92,246,.45);
    --radius: 20px; --ease: cubic-bezier(.2,.8,.2,1);
  }
  :root[data-theme="light"] {
    --bg: #fbfaff; --bg-glow: rgba(124, 58, 237, .10); --surface: #ffffff; --surface-2: #f5f3ff; --hover: #efecfb;
    --text: #17152b; --text-2: #4b4a63; --text-3: #6b6a82; --border: rgba(23,21,43,.09); --border-strong: rgba(23,21,43,.16);
    --primary: #7c3aed; --primary-2: #0891b2; --user: #f1edff; --code: #12111c; --code-head: #1b1a28;
    --danger-bg: rgba(220,38,38,.08); --shadow: 0 10px 40px rgba(60,40,140,.12); --ring: 0 0 0 3px rgba(124,58,237,.3);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #fbfaff; --bg-glow: rgba(124, 58, 237, .10); --surface: #ffffff; --surface-2: #f5f3ff; --hover: #efecfb;
      --text: #17152b; --text-2: #4b4a63; --text-3: #6b6a82; --border: rgba(23,21,43,.09); --border-strong: rgba(23,21,43,.16);
      --primary: #7c3aed; --primary-2: #0891b2; --user: #f1edff; --code: #12111c; --code-head: #1b1a28;
      --danger-bg: rgba(220,38,38,.08); --shadow: 0 10px 40px rgba(60,40,140,.12); --ring: 0 0 0 3px rgba(124,58,237,.3);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(900px 500px at 50% -10%, var(--bg-glow), transparent 70%), var(--bg);
    color: var(--text); font: 16px/1.65 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: none; box-shadow: var(--ring); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
    padding: 10px max(16px, env(safe-area-inset-left)); height: 60px;
    background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: saturate(160%) blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .mark { width: 32px; height: 32px; border-radius: 9px; display: block; flex: none; object-fit: cover; background: #fff;
          box-shadow: 0 0 0 1px var(--border), 0 4px 14px rgba(0,0,0,.25); }
  .title { font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
  .spacer { flex: 1; }
  .status { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 99px;
            border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font-size: 13px; font-weight: 500; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
  .status.ok i { background: var(--ok); box-shadow: 0 0 0 3px rgba(34,197,94,.18); }
  .status.warn i { background: var(--warn); box-shadow: 0 0 0 3px rgba(245,158,11,.18); }
  .status.bad i { background: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,.18); }
  .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 1px solid transparent;
              background: transparent; color: var(--text-2); transition: background .2s var(--ease), color .2s var(--ease); }
  .icon-btn:hover { background: var(--hover); color: var(--text); }

  /* ---------- thread ---------- */
  main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .thread { max-width: 760px; margin: 0 auto; padding: 24px 20px 12px; }
  .hero { min-height: 52vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; padding-bottom: 28px; }
  .hero .mark { width: 72px; height: 72px; border-radius: 20px; margin-bottom: 22px; box-shadow: 0 0 0 1px var(--border), 0 12px 40px rgba(0,0,0,.35); }
  .hero h1 { margin: 0; font-size: clamp(28px, 5vw, 40px); font-weight: 600; letter-spacing: -.03em; line-height: 1.15; }
  .hero h1 span { background: linear-gradient(90deg, var(--primary), var(--primary-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { margin: 10px 0 0; color: var(--text-2); font-size: 16px; }
  .notice { margin: 18px auto 0; max-width: 520px; display: flex; gap: 10px; align-items: flex-start; text-align: left;
            padding: 12px 14px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font-size: 14px; }
  .notice svg { color: var(--warn); margin-top: 2px; }

  .msg { margin: 26px 0; animation: rise .35s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble { max-width: 82%; background: var(--user); border: 1px solid var(--border); padding: 11px 16px;
                      border-radius: 20px 20px 6px 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.bot { display: grid; grid-template-columns: 32px 1fr; gap: 14px; }
  .msg.bot .mark { width: 30px; height: 30px; border-radius: 9px; margin-top: 2px; box-shadow: 0 0 0 1px var(--border); }
  .content { min-width: 0; overflow-wrap: anywhere; }
  .content p { margin: 0 0 12px; } .content p:last-child { margin-bottom: 0; }
  .content h3, .content h4 { margin: 18px 0 8px; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .content ul, .content ol { margin: 0 0 12px; padding-left: 22px; } .content li { margin: 4px 0; }
  .content code { font: 13.5px/1.5 "JetBrains Mono", ui-monospace, Consolas, monospace; background: var(--surface-2);
                  border: 1px solid var(--border); padding: 1px 6px; border-radius: 6px; }
  .content strong { font-weight: 600; }
  .codeblock { margin: 12px 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--border-strong); background: var(--code); }
  .codehead { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 14px;
              background: var(--code-head); color: #a3a3b8; font: 12px "JetBrains Mono", ui-monospace, monospace; }
  .codeblock pre { margin: 0; padding: 14px 16px; overflow-x: auto; color: #e6e6f0; }
  .codeblock pre code { background: none; border: 0; padding: 0; font-size: 13px; color: inherit; }
  .mini { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; border: 0;
          background: transparent; color: inherit; font-size: 12.5px; transition: background .2s var(--ease), color .2s var(--ease); }
  .mini svg { width: 14px; height: 14px; }
  .codehead .mini:hover { background: rgba(255,255,255,.08); color: #fff; }
  .actions { display: flex; gap: 2px; margin-top: 8px; margin-left: -8px; color: var(--text-3); opacity: 0; transition: opacity .2s var(--ease); }
  .msg.bot:hover .actions, .actions:focus-within { opacity: 1; }
  .actions .mini:hover { background: var(--hover); color: var(--text); }
  .meta { font-size: 12px; color: var(--text-3); margin-left: 6px; align-self: center; }
  .typing { display: inline-flex; gap: 5px; padding: 10px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); animation: bounce 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-5px); opacity: 1; } }
  .caret::after { content: ""; display: inline-block; width: 8px; height: 17px; margin-left: 2px; vertical-align: -3px;
                  border-radius: 2px; background: var(--primary); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .error { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px;
           background: var(--danger-bg); border: 1px solid rgba(239,68,68,.25); color: var(--text); font-size: 15px; }
  .error svg { color: var(--danger); margin-top: 3px; }

  /* ---------- composer ---------- */
  .dock { padding: 8px 16px calc(12px + env(safe-area-inset-bottom)); }
  .composer { max-width: 760px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border-strong);
              border-radius: 24px; box-shadow: var(--shadow); transition: border-color .2s var(--ease), box-shadow .2s var(--ease); }
  .composer:focus-within { border-color: color-mix(in srgb, var(--primary) 55%, var(--border-strong)); box-shadow: var(--shadow), var(--ring); }
  textarea { display: block; width: 100%; resize: none; border: 0; outline: 0; background: transparent; color: var(--text);
             font: inherit; padding: 16px 18px 6px; min-height: 56px; max-height: 220px; }
  textarea::placeholder { color: var(--text-3); }
  textarea:focus-visible { box-shadow: none; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px 8px 10px; }
  .send { width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center; color: var(--on-primary);
          background: linear-gradient(135deg, var(--primary), var(--primary-2)); transition: transform .15s var(--ease), opacity .2s var(--ease); }
  .send:hover { transform: scale(1.05); } .send:active { transform: scale(.96); }
  .send:disabled { opacity: .35; cursor: default; transform: none; }
  .send.stop { background: var(--text); color: var(--bg); }
  .send svg { stroke-width: 2.4; }
  .hint { max-width: 760px; margin: 8px auto 0; text-align: center; font-size: 12px; color: var(--text-3); }

  /* model selector */
  .picker { position: relative; }
  .picker-btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 12px; border-radius: 12px;
                border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 14px; font-weight: 500;
                transition: background .2s var(--ease), border-color .2s var(--ease); }
  .picker-btn:hover { background: var(--hover); border-color: var(--border-strong); }
  .picker-btn .chev { width: 15px; height: 15px; color: var(--text-3); transition: transform .2s var(--ease); }
  .picker-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .picker-btn .ico { width: 16px; height: 16px; color: var(--primary); }
  .menu { position: absolute; left: 0; bottom: calc(100% + 10px); width: min(300px, calc(100vw - 48px)); padding: 6px; margin: 0; list-style: none;
          background: var(--surface); border: 1px solid var(--border-strong); border-radius: 16px; box-shadow: var(--shadow); z-index: 10;
          transform-origin: bottom left; animation: pop .16s var(--ease); }
  @keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } to { opacity: 1; transform: none; } }
  .menu-label { padding: 8px 10px 6px; font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
  .opt { display: grid; grid-template-columns: 34px 1fr 18px; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 11px; cursor: pointer; }
  .opt .oi { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--primary); }
  .opt b { display: block; font-size: 14px; font-weight: 600; }
  .opt small { display: block; font-size: 12.5px; color: var(--text-2); line-height: 1.35; }
  .opt .tick { color: var(--primary); opacity: 0; }
  .opt[aria-selected="true"] .tick { opacity: 1; }
  .opt:hover, .opt.active { background: var(--hover); }
  .opt[aria-disabled="true"] { cursor: default; opacity: .55; }
  .opt[aria-disabled="true"]:hover { background: transparent; }
  .soon { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 99px; font-size: 10.5px; font-weight: 600;
          background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); vertical-align: 1px; }

  /* empty state: composer floats in the middle with the hero */
  body.empty main { flex: 0 1 auto; }
  body.empty .dock { flex: 1; padding-top: 0; }

  @media (max-width: 600px) {
    body { font-size: 15.5px; }
    header { height: 56px; }
    .title { display: none; }
    .thread { padding: 16px 14px 8px; }
    .msg.bot { grid-template-columns: 1fr; gap: 8px; }
    .msg.bot > .mark { display: none; }
    .msg.user .bubble { max-width: 90%; }
    .actions { opacity: 1; }
    .hero { min-height: 38vh; }
    .status span { display: none; } .status { padding: 0 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body class="empty">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-k" viewBox="0 0 24 24"><path d="M8 5v14M8 12l8-7M10.5 10.5 17 19"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></symbol>
  <symbol id="i-new" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></symbol>
  <symbol id="i-balanced" viewBox="0 0 24 24"><path d="M12 3v18M5 7h14M5 7l-3 7a4 4 0 0 0 6 0zM19 7l-3 7a4 4 0 0 0 6 0z"/></symbol>
  <symbol id="i-precise" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
  <symbol id="i-creative" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>
  <symbol id="i-quick" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></symbol>
  <symbol id="i-vision" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
</svg>

<header>
  <img class="mark" src="logo.png" alt="" aria-hidden="true">
  <div class="title">Kairos</div>
  <div class="spacer"></div>
  <div class="status" id="status" role="status" aria-live="polite"><i></i><span id="statusText">Connecting…</span></div>
  <button class="icon-btn" id="theme" aria-label="Switch light or dark theme" title="Theme"><svg><use id="themeIcon" href="#i-sun"/></svg></button>
  <button class="icon-btn" id="newchat" aria-label="New chat" title="New chat"><svg><use href="#i-new"/></svg></button>
</header>

<main id="main">
  <div class="thread" id="thread">
    <section class="hero" id="hero">
      <img class="mark" src="logo.png" alt="" aria-hidden="true">
      <h1>Hi, I'm <span>Kairos</span></h1>
      <p>How can I help you today?</p>
      <div class="notice" id="notice" hidden><svg><use href="#i-alert"/></svg><span id="noticeText"></span></div>
    </section>
  </div>
</main>

<div class="dock">
  <form class="composer" id="composer" autocomplete="off">
    <label for="input" class="sr">Message Kairos</label>
    <textarea id="input" rows="1" placeholder="Message Kairos…" enterkeyhint="send"></textarea>
    <div class="bar">
      <div class="picker">
        <button type="button" class="picker-btn" id="pickerBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="menu">
          <svg class="ico"><use id="pickerIcon" href="#i-balanced"/></svg><span id="pickerLabel">Kairos</span><svg class="chev"><use href="#i-chev"/></svg>
        </button>
        <ul class="menu" id="menu" role="listbox" aria-label="Choose model" tabindex="-1" hidden></ul>
      </div>
      <div class="spacer"></div>
      <button type="submit" class="send" id="send" aria-label="Send message" disabled><svg><use id="sendIcon" href="#i-up"/></svg></button>
    </div>
  </form>
  <div class="hint">Kairos can make mistakes. Check important info.</div>
</div>

<script type="module">
const FAKE = new URLSearchParams(location.search).get("fake") === "1";   // UI test mode: no server needed
const HISTORY_SIZE = 12;
const MODELS = [
  { id: "balanced", name: "Kairos",          desc: "Smart, well-rounded answers",            icon: "balanced" },
  { id: "precise",  name: "Kairos Precise",  desc: "Focused and factual — best for code & math", icon: "precise" },
  { id: "creative", name: "Kairos Creative", desc: "Imaginative — stories, poems and ideas",  icon: "creative" },
  { id: "quick",    name: "Kairos Quick",    desc: "Short, fast replies",                     icon: "quick" },
  { id: "vision",   name: "Kairos Vision",   desc: "Understands photos",                      icon: "vision", soon: true },
];
const ERRORS = {
  offline: "Kairos is resting right now. Please try again in a little while.",
  loading: "Kairos is still waking up — try again in a minute.",
  not_configured: "This website isn't connected to the Kairos server yet.",
};

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const icon = (name, cls = "") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

let history = store.get("kairos.history", []);
let mode = MODELS.some((m) => m.id === store.get("kairos.mode", "") && !m.soon) ? store.get("kairos.mode", "") : "balanced";
let busy = false, controller = null;

// ---------- theme ----------
function applyTheme(t) {
  if (t) document.documentElement.dataset.theme = t;
  const dark = (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")) === "dark";
  $("themeIcon").setAttribute("href", dark ? "#i-sun" : "#i-moon");
  document.querySelector('meta[name="theme-color"]').content = dark ? "#09090f" : "#fbfaff";
}
applyTheme(store.get("kairos.theme", null));
$("theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  const next = cur === "dark" ? "light" : "dark";
  store.set("kairos.theme", next); applyTheme(next);
};

// ---------- status ----------
function setStatus(kind, text, notice) {
  $("status").className = `status ${kind}`;
  $("statusText").textContent = text;
  $("notice").hidden = !notice;
  $("noticeText").textContent = notice || "";
}
async function checkHealth() {
  if (FAKE) return setStatus("ok", "Online");
  try {
    const h = await (await fetch("/api/health", { cache: "no-store" })).json();
    if (h.online && h.ready) setStatus("ok", "Online");
    else if (h.online) setStatus("warn", "Waking up", "Kairos is waking up — this takes about a minute.");
    else setStatus("bad", "Offline", ERRORS.offline);
  } catch { setStatus("bad", "Offline", "Can't reach Kairos. Check your internet connection."); }
}
checkHealth(); setInterval(checkHealth, 60000);

// ---------- model picker ----------
const menu = $("menu"), pickerBtn = $("pickerBtn");
function renderPicker() {
  const m = MODELS.find((x) => x.id === mode);
  $("pickerLabel").textContent = m.name;
  $("pickerIcon").setAttribute("href", `#i-${m.icon}`);
  menu.innerHTML = `<li class="menu-label" role="presentation">Model</li>` + MODELS.map((x) => `
    <li class="opt" role="option" id="opt-${x.id}" data-id="${x.id}" aria-selected="${x.id === mode}" ${x.soon ? 'aria-disabled="true"' : ""}>
      <span class="oi">${icon(x.icon)}</span>
      <span><b>${x.name}${x.soon ? '<span class="soon">Soon</span>' : ""}</b><small>${x.desc}</small></span>
      ${icon("check", "tick")}
    </li>`).join("");
}
let activeIdx = 0;
const choices = () => [...menu.querySelectorAll('.opt:not([aria-disabled="true"])')];
function openMenu() {
  menu.hidden = false; pickerBtn.setAttribute("aria-expanded", "true");
  activeIdx = Math.max(0, choices().findIndex((o) => o.dataset.id === mode));
  highlight(); menu.focus();
}
function closeMenu(focusBtn = true) {
  menu.hidden = true; pickerBtn.setAttribute("aria-expanded", "false");
  if (focusBtn) pickerBtn.focus();
}
function highlight() {
  const opts = choices();
  opts.forEach((o, i) => o.classList.toggle("active", i === activeIdx));
  menu.setAttribute("aria-activedescendant", opts[activeIdx]?.id || "");
}
function choose(id) {
  const m = MODELS.find((x) => x.id === id);
  if (!m || m.soon) return;
  mode = id; store.set("kairos.mode", id); renderPicker(); closeMenu(false); $("input").focus();
}
pickerBtn.onclick = () => (menu.hidden ? openMenu() : closeMenu());
menu.addEventListener("click", (e) => { const o = e.target.closest(".opt"); if (o) choose(o.dataset.id); });
menu.addEventListener("keydown", (e) => {
  const opts = choices();
  if (e.key === "ArrowDown") { activeIdx = (activeIdx + 1) % opts.length; highlight(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { activeIdx = (activeIdx - 1 + opts.length) % opts.length; highlight(); e.preventDefault(); }
  else if (e.key === "Enter" || e.key === " ") { choose(opts[activeIdx].dataset.id); e.preventDefault(); }
  else if (e.key === "Escape" || e.key === "Tab") closeMenu(e.key === "Escape");
});
document.addEventListener("click", (e) => { if (!menu.hidden && !e.target.closest(".picker")) closeMenu(false); });
renderPicker();

// ---------- markdown (escape first, then format) ----------
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inline = (s) => s.replace(/`([^`\n]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
  .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, "$1<em>$2</em>");
const UL = /^\s*[-*•]\s+/, OL = /^\s*\d+[.)]\s+/, H = /^(#{1,4})\s+(.*)$/;
function block(b) {
  // split a paragraph into runs of the same kind: heading / bullet list / numbered list / text
  let out = "", run = [], kind = null;
  const flush = () => {
    if (!run.length) return;
    if (kind === "h") out += run.map((l) => { const m = l.match(H); const n = m[1].length <= 2 ? 3 : 4; return `<h${n}>${inline(m[2])}</h${n}>`; }).join("");
    else if (kind === "ul") out += `<ul>${run.map((l) => `<li>${inline(l.replace(UL, ""))}</li>`).join("")}</ul>`;
    else if (kind === "ol") out += `<ol>${run.map((l) => `<li>${inline(l.replace(OL, ""))}</li>`).join("")}</ol>`;
    else out += `<p>${run.map(inline).join("<br>")}</p>`;
    run = [];
  };
  for (const l of b.split("\n")) {
    const k = H.test(l) ? "h" : UL.test(l) ? "ul" : OL.test(l) ? "ol" : "p";
    if (k !== kind) { flush(); kind = k; }
    run.push(l);
  }
  flush();
  return out;
}
function toHtml(text) {
  return text.split("```").map((part, i) => {
    if (i % 2) {
      const nl = part.indexOf("\n");
      const lang = nl >= 0 && /^[\w+#.-]*$/.test(part.slice(0, nl).trim()) ? part.slice(0, nl).trim() : "";
      const code = lang || nl === 0 ? part.slice(nl + 1) : part;
      return `<div class="codeblock"><div class="codehead"><span>${esc(lang || "code")}</span>` +
             `<button type="button" class="mini copy-code" aria-label="Copy code">${icon("copy")}<span>Copy</span></button></div>` +
             `<pre><code>${esc(code.replace(/\n$/, ""))}</code></pre></div>`;
    }
    return esc(part).split(/\n{2,}/).filter((b) => b.trim()).map(block).join("");
  }).join("");
}

// ---------- thread ----------
const thread = $("thread"), main = $("main"), input = $("input"), send = $("send");
function setEmpty(empty) { document.body.classList.toggle("empty", empty); $("hero").hidden = !empty; }
function scrollDown() { main.scrollTop = main.scrollHeight; }

function addUser(text) {
  const row = document.createElement("div");
  row.className = "msg user";
  row.innerHTML = `<div class="bubble"></div>`;
  row.firstChild.textContent = text;
  thread.appendChild(row); scrollDown();
}
function addBot(text = "", { typing = false, modelName = "" } = {}) {
  const row = document.createElement("div");
  row.className = "msg bot";
  row.innerHTML = `<img class="mark" src="logo.png" alt="" aria-hidden="true">
    <div><div class="content">${typing ? '<span class="typing" aria-label="Kairos is typing"><i></i><i></i><i></i></span>' : toHtml(text)}</div>
    <div class="actions" ${typing ? "hidden" : ""}>
      <button type="button" class="mini copy-msg" aria-label="Copy reply">${icon("copy")}</button>
      <button type="button" class="mini retry" aria-label="Regenerate reply">${icon("retry")}</button>
      <span class="meta">${esc(modelName)}</span></div></div>`;
  thread.appendChild(row); scrollDown();
  return row;
}
function setBot(row, text, streaming) {
  row.querySelector(".content").innerHTML = toHtml(text) || "";
  row.querySelector(".content").classList.toggle("caret", streaming);
  row.dataset.raw = text;
}
function showError(row, message) {
  row.querySelector(".content").innerHTML = `<div class="error">${icon("alert")}<span>${esc(message)}</span></div>`;
  row.querySelector(".content").classList.remove("caret");
}

// ---------- talking to Kairos ----------
async function* fakeStream() {
  const reply = `Hello! I'm **Kairos**, created by Abhimanyu. You're using *${MODELS.find((m) => m.id === mode).name}* in test mode.\n\n### What I can do\n- Answer questions\n- Write and explain code\n- Help with stories and ideas\n\n\`\`\`python\ndef greet(name):\n    return f"Hello, {name}!"\n\`\`\``;
  for (const w of reply.split(/(\s+)/)) { await new Promise((r) => setTimeout(r, 12)); yield w; }
}
async function* serverStream(messages, signal) {
  const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
                                         body: JSON.stringify({ messages, mode }), signal });
  if (!res.ok) {
    let code = ""; try { code = (await res.json()).error; } catch {}
    throw new Error(ERRORS[code] || `Something went wrong (error ${res.status}). Please try again.`);
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) return;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const line = buf.slice(0, i).split("\n").find((l) => l.startsWith("data: ")); buf = buf.slice(i + 2);
      if (!line) continue;
      if (line === "data: [DONE]") return;
      const msg = JSON.parse(line.slice(6));
      if (msg.error) throw new Error("Kairos hit a problem while answering. Please try again.");
      if (msg.token) yield msg.token;
    }
  }
}

function setBusy(on) {
  busy = on;
  send.classList.toggle("stop", on);
  $("sendIcon").setAttribute("href", on ? "#i-stop" : "#i-up");
  send.setAttribute("aria-label", on ? "Stop generating" : "Send message");
  send.disabled = !on && !input.value.trim();
}

async function respond() {
  const modelName = MODELS.find((m) => m.id === mode).name;
  const row = addBot("", { typing: true, modelName });
  setBusy(true); controller = new AbortController();
  let text = "", failed = false;
  try {
    const stream = FAKE ? fakeStream() : serverStream(history.slice(-HISTORY_SIZE), controller.signal);
    for await (const piece of stream) {
      if (controller.signal.aborted) break;
      text += piece; setBot(row, text, true); scrollDown();
    }
  } catch (err) {
    if (err.name !== "AbortError") { failed = true; showError(row, err.message); }
  }
  if (!failed) {
    text = text.trim() || "…";
    setBot(row, text, false);
    history.push({ role: "assistant", content: text, model: modelName });
    store.set("kairos.history", history.slice(-40));
  }
  row.querySelector(".actions").hidden = false;
  if (failed) row.querySelector(".copy-msg").hidden = true;
  setBusy(false); input.focus(); checkHealth();
}

function submit() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = ""; autosize();
  setEmpty(false);
  history.push({ role: "user", content: text });
  addUser(text);
  respond();
}

$("composer").addEventListener("submit", (e) => { e.preventDefault(); busy ? controller?.abort() : submit(); });
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!busy) submit(); }
});
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 220) + "px"; if (!busy) send.disabled = !input.value.trim(); }
input.addEventListener("input", autosize);

thread.addEventListener("click", async (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const flash = (b) => { const u = b.querySelector("use"); u.setAttribute("href", "#i-check"); setTimeout(() => u.setAttribute("href", "#i-copy"), 1300); };
  if (btn.classList.contains("copy-code")) {
    await navigator.clipboard?.writeText(btn.closest(".codeblock").querySelector("code").textContent); flash(btn);
  } else if (btn.classList.contains("copy-msg")) {
    await navigator.clipboard?.writeText(btn.closest(".msg").dataset.raw || ""); flash(btn);
  } else if (btn.classList.contains("retry") && !busy) {
    const row = btn.closest(".msg");
    if (row !== thread.lastElementChild) return;              // only the latest reply can be regenerated
    if (history.at(-1)?.role === "assistant") history.pop();
    row.remove(); respond();
  }
});

$("newchat").onclick = () => {
  if (busy) controller?.abort();
  history = []; store.set("kairos.history", []);
  thread.querySelectorAll(".msg").forEach((n) => n.remove());
  setEmpty(true); input.focus();
};

// restore the previous conversation
if (history.length) {
  setEmpty(false);
  history.forEach((m) => {
    if (m.role === "user") addUser(m.content);
    else { const r = addBot(m.content, { modelName: m.model || "Kairos" }); r.dataset.raw = m.content; }
  });
}
input.focus();
</script>
