<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kairos</title>
<meta name="description" content="Kairos - an AI assistant created by Abhimanyu.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='36' font-weight='700' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f7f7fb; --panel: #ffffff; --text: #16161d; --muted: #6b6b7b; --border: #e4e4ee;
    --user: #ece9fe; --bot: #ffffff; --accent: #6d28d9; --accent2: #2563eb; --code: #0f1020; --codetext: #e6e6f0;
    --danger: #dc2626; --ok: #16a34a; --warn: #d97706; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(20,20,60,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0d14; --panel: #15151f; --text: #ececf3; --muted: #9a9aad; --border: #262636;
      --user: #2a2346; --bot: #15151f; --code: #07070d; --codetext: #e6e6f0; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0d14; --panel: #15151f; --text: #ececf3; --muted: #9a9aad; --border: #262636;
    --user: #2a2346; --bot: #15151f; --code: #07070d; --codetext: #e6e6f0; --shadow: none;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border);
           background: var(--panel); position: sticky; top: 0; z-index: 2; }
  .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 700;
          background: linear-gradient(135deg, var(--accent), var(--accent2)); flex: none; }
  .brand { display: flex; flex-direction: column; line-height: 1.15; }
  .brand b { font-size: 17px; }
  .brand span { font-size: 12px; color: var(--muted); }
  .spacer { flex: 1; }
  button { font: inherit; color: var(--text); }
  .icon-btn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
  .icon-btn:hover { border-color: var(--accent); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .pill.ok .dot { background: var(--ok); } .pill.warn .dot { background: var(--warn); } .pill.bad .dot { background: var(--danger); }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .welcome { text-align: center; padding: 8vh 8px 16px; }
  .welcome .big { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 12px; font-size: 32px; }
  .welcome h1 { margin: 0 0 4px; font-size: 28px;
                background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .welcome p { color: var(--muted); margin: 4px 0; }
  .banner { max-width: 560px; margin: 14px auto 0; padding: 10px 14px; border-radius: 10px; font-size: 14px;
            border: 1px solid var(--border); background: var(--panel); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .chip { border: 1px solid var(--border); background: var(--panel); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
  .chip:hover { border-color: var(--accent); }
  .msg { display: flex; margin: 14px 0; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 86%; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--border); overflow-wrap: anywhere; }
  .user .bubble { background: var(--user); border-color: transparent; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .bot .bubble { background: var(--bot); border-bottom-left-radius: 4px; box-shadow: var(--shadow); }
  .bot .who { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
  .bubble code { background: rgba(127,127,160,.15); padding: 1px 5px; border-radius: 5px; font-size: 13.5px; }
  pre { position: relative; background: var(--code); color: var(--codetext); padding: 12px; border-radius: 10px; overflow-x: auto; margin: 8px 0; }
  pre code { background: none; padding: 0; font-size: 13px; }
  .copy { position: absolute; top: 6px; right: 6px; font-size: 12px; background: rgba(255,255,255,.1); color: #fff;
          border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .cursor::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }
  .thinking { color: var(--muted); font-style: italic; }
  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; min-height: 44px; max-height: 180px; padding: 11px 12px; border-radius: 12px;
             border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: 0; border-radius: 10px;
             padding: 10px 18px; font-weight: 600; cursor: pointer; }
  .primary:disabled { opacity: .55; cursor: default; }
  #send { height: 44px; min-width: 76px; }
  #send.stop { background: var(--danger); }
  .note { max-width: 820px; margin: 6px auto 0; text-align: center; font-size: 12px; color: var(--muted); }
  @media (max-width: 560px) { .brand span, .lbl { display: none; } header { gap: 8px; padding: 8px 12px; } main { padding: 12px; } .bubble { max-width: 94%; } }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">K</div>
  <div class="brand"><b>Kairos</b><span>AI assistant by Abhimanyu</span></div>
  <div class="spacer"></div>
  <span class="pill" id="pill" title="Kairos server status"><i class="dot"></i><span id="pillText">Checking…</span></span>
  <button class="icon-btn" id="theme" title="Light / dark" aria-label="Toggle light or dark theme">◐</button>
  <button class="icon-btn" id="newchat" title="New chat" aria-label="New chat">＋<span class="lbl"> New</span></button>
</header>

<main id="main">
  <div class="wrap" id="chat">
    <section class="welcome" id="welcome">
      <div class="logo big">K</div>
      <h1>Kairos</h1>
      <p>Your AI assistant, created by Abhimanyu.</p>
      <div class="banner" id="banner" hidden></div>
      <div class="chips" id="chips">
        <button class="chip">Who are you?</button>
        <button class="chip">Write a Python function to reverse a string</button>
        <button class="chip">Explain black holes simply</button>
        <button class="chip">Write a short poem about the monsoon</button>
        <button class="chip">I'm stressed about my exams</button>
      </div>
    </section>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Message Kairos…"></textarea>
    <button class="primary" id="send">Send</button>
  </div>
  <div class="note">Kairos can make mistakes. Check important info.</div>
</footer>

<script type="module">
const HISTORY_SIZE = 12;
const FAKE = new URLSearchParams(location.search).get("fake") === "1";   // UI test mode: no server needed

const $ = (id) => document.getElementById(id);
const el = { main: $("main"), chat: $("chat"), welcome: $("welcome"), banner: $("banner"), chips: $("chips"),
  input: $("input"), send: $("send"), pill: $("pill"), pillText: $("pillText"), theme: $("theme"), newchat: $("newchat") };

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let history = store.get("kairos.history", []);
let busy = false, controller = null, currentBubble = null, currentText = "";

// ---------- theme ----------
const savedTheme = store.get("kairos.theme", null);
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
el.theme.onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const now = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = now === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  store.set("kairos.theme", next);
};

// ---------- server status ----------
function setStatus(kind, text, banner) {
  el.pill.className = `pill ${kind}`;
  el.pillText.textContent = text;
  el.banner.hidden = !banner;
  el.banner.textContent = banner || "";
}
async function checkHealth() {
  if (FAKE) return setStatus("ok", "Online (test)");
  try {
    const h = await (await fetch("/api/health", { cache: "no-store" })).json();
    if (h.online && h.ready) setStatus("ok", "Online");
    else if (h.online) setStatus("warn", "Starting…", "Kairos is starting up — this takes about a minute.");
    else setStatus("bad", "Offline", "Kairos is sleeping right now. Please try again in a little while.");
  } catch {
    setStatus("bad", "Offline", "Can't reach Kairos right now. Check your internet and try again.");
  }
}
checkHealth();
setInterval(checkHealth, 60000);

// ---------- chat ----------
function scrollDown() { el.main.scrollTop = el.main.scrollHeight; }

function addMessage(role, text) {
  const row = document.createElement("div");
  row.className = `msg ${role === "user" ? "user" : "bot"}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (role === "user") bubble.textContent = text;
  else renderBot(bubble, text, false);
  row.appendChild(bubble);
  el.chat.appendChild(row);
  scrollDown();
  return bubble;
}

const ERRORS = {
  offline: "Kairos is sleeping right now 😴 Please try again in a little while.",
  loading: "Kairos is still starting up — please try again in a minute.",
  not_configured: "The website isn't connected to the Kairos server yet.",
};

async function* fakeStream() {
  const reply = "Hello! I'm **Kairos**, created by Abhimanyu. This is *test mode*.\n\n```python\nprint('hi')\n```";
  for (const w of reply.split(/(\s+)/)) { await new Promise((r) => setTimeout(r, 15)); yield w; }
}

async function* serverStream(messages, signal) {
  const res = await fetch("/api/chat", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ messages }), signal,
  });
  if (!res.ok) {
    let code = "";
    try { code = (await res.json()).error; } catch {}
    throw new Error(ERRORS[code] || `Something went wrong (error ${res.status}). Please try again.`);
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const event = buf.slice(0, i); buf = buf.slice(i + 2);
      const line = event.split("\n").find((l) => l.startsWith("data: "));
      if (!line) continue;
      const data = line.slice(6);
      if (data === "[DONE]") return;
      const msg = JSON.parse(data);
      if (msg.error) throw new Error("Kairos hit a problem while answering. Please try again.");
      if (msg.token) yield msg.token;
    }
  }
}

async function send(text) {
  text = (text ?? el.input.value).trim();
  if (!text || busy) return;
  el.input.value = ""; autosize();
  el.welcome.hidden = true;
  history.push({ role: "user", content: text });
  addMessage("user", text);
  currentText = "";
  currentBubble = addMessage("assistant", "");
  currentBubble.innerHTML = `<div class="who">Kairos</div><div class="thinking">Thinking…</div>`;
  busy = true; controller = new AbortController();
  el.send.textContent = "Stop"; el.send.classList.add("stop");
  try {
    const stream = FAKE ? fakeStream() : serverStream(history.slice(-HISTORY_SIZE), controller.signal);
    for await (const piece of stream) {
      if (controller.signal.aborted) break;
      currentText += piece;
      renderBot(currentBubble, currentText, true);
      scrollDown();
    }
  } catch (err) {
    if (err.name !== "AbortError") currentText += (currentText ? "\n\n" : "") + "⚠️ " + err.message;
  }
  finishReply();
}

function finishReply() {
  busy = false;
  const text = currentText.trim() || "…";
  renderBot(currentBubble, text, false);
  if (!text.startsWith("⚠️")) history.push({ role: "assistant", content: text });
  else history.pop();                                    // don't keep a failed turn in the conversation
  store.set("kairos.history", history.slice(-40));
  el.send.textContent = "Send"; el.send.classList.remove("stop");
  el.input.focus();
  checkHealth();
}

el.send.onclick = () => (busy ? controller?.abort() : send());
el.input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!busy) send(); }
});
function autosize() { el.input.style.height = "auto"; el.input.style.height = Math.min(el.input.scrollHeight, 180) + "px"; }
el.input.addEventListener("input", autosize);
el.chips.addEventListener("click", (e) => { if (e.target.classList.contains("chip")) send(e.target.textContent); });

el.newchat.onclick = () => {
  if (busy) controller?.abort();
  history = []; store.set("kairos.history", []);
  [...el.chat.querySelectorAll(".msg")].forEach((n) => n.remove());
  el.welcome.hidden = false;
};

if (history.length) {                                    // restore previous chat
  history.forEach((m) => addMessage(m.role, m.content));
  el.welcome.hidden = true;
}

// ---------- tiny, safe markdown (escape first, then format) ----------
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function inline(s) {
  return s
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, "$1<i>$2</i>");
}
function toHtml(text) {
  return text.split(/```/).map((part, i) => {
    if (i % 2 === 1) {
      const nl = part.indexOf("\n");
      const code = nl >= 0 && /^[\w+#.-]*$/.test(part.slice(0, nl).trim()) ? part.slice(nl + 1) : part;
      return `<pre><button class="copy">Copy</button><code>${escapeHtml(code.replace(/\n$/, ""))}</code></pre>`;
    }
    return escapeHtml(part).split(/\n{2,}/).filter((p) => p.trim())
      .map((p) => `<p>${inline(p).replace(/\n/g, "<br>")}</p>`).join("");
  }).join("");
}
function renderBot(bubble, text, typing) {
  bubble.innerHTML = `<div class="who">Kairos</div><div class="${typing ? "cursor" : ""}">${toHtml(text)}</div>`;
}
el.chat.addEventListener("click", (e) => {
  if (!e.target.classList.contains("copy")) return;
  const code = e.target.parentElement.querySelector("code").textContent;
  navigator.clipboard?.writeText(code).then(() => { e.target.textContent = "Copied!"; setTimeout(() => (e.target.textContent = "Copy"), 1200); });
});
</script>
</body>
</html>
