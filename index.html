<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kairos</title>
<meta name="description" content="Kairos - an AI assistant created by Abhimanyu. Runs privately in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='36' font-weight='700' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f7f7fb; --panel: #ffffff; --text: #16161d; --muted: #6b6b7b; --border: #e4e4ee;
    --user: #ece9fe; --bot: #ffffff; --accent: #6d28d9; --accent2: #2563eb; --code: #0f1020; --codetext: #e6e6f0;
    --danger: #dc2626; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(20,20,60,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0d14; --panel: #15151f; --text: #ececf3; --muted: #9a9aad; --border: #262636;
      --user: #2a2346; --bot: #15151f; --code: #07070d; --codetext: #e6e6f0; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0d14; --panel: #15151f; --text: #ececf3; --muted: #9a9aad; --border: #262636;
    --user: #2a2346; --bot: #15151f; --code: #07070d; --codetext: #e6e6f0; --shadow: none;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border);
           background: var(--panel); position: sticky; top: 0; z-index: 2; }
  .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 700;
          background: linear-gradient(135deg, var(--accent), var(--accent2)); flex: none; }
  .brand { display: flex; flex-direction: column; line-height: 1.15; }
  .brand b { font-size: 17px; }
  .brand span { font-size: 12px; color: var(--muted); }
  .spacer { flex: 1; }
  select, button { font: inherit; color: var(--text); }
  select { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; max-width: 46vw; }
  .icon-btn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
  .welcome.compact { padding-top: 8px; }
  .welcome.compact .big, .welcome.compact h1, .welcome.compact > p { display: none; }
  .welcome.compact .card { margin-top: 0; }
  .icon-btn:hover { border-color: var(--accent); }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .welcome { text-align: center; padding: 6vh 8px 16px; }
  .welcome .big { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 12px; font-size: 32px; }
  .welcome h1 { margin: 0 0 4px; font-size: 28px;
                background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .welcome p { color: var(--muted); margin: 4px 0; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin: 18px auto;
          max-width: 520px; box-shadow: var(--shadow); text-align: left; }
  .primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: 0; border-radius: 10px;
             padding: 10px 18px; font-weight: 600; cursor: pointer; }
  .primary:disabled { opacity: .55; cursor: default; }
  .bar { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; margin: 12px 0 6px; }
  .bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .2s; }
  .small { font-size: 13px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .chip { border: 1px solid var(--border); background: var(--panel); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
  .chip:hover { border-color: var(--accent); }
  .msg { display: flex; margin: 14px 0; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 86%; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--border); overflow-wrap: anywhere; }
  .user .bubble { background: var(--user); border-color: transparent; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .bot .bubble { background: var(--bot); border-bottom-left-radius: 4px; box-shadow: var(--shadow); }
  .bot .who { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
  .bubble code { background: rgba(127,127,160,.15); padding: 1px 5px; border-radius: 5px; font-size: 13.5px; }
  pre { position: relative; background: var(--code); color: var(--codetext); padding: 12px; border-radius: 10px; overflow-x: auto; margin: 8px 0; }
  pre code { background: none; padding: 0; font-size: 13px; }
  .copy { position: absolute; top: 6px; right: 6px; font-size: 12px; background: rgba(255,255,255,.1); color: #fff;
          border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .cursor::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }
  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; min-height: 44px; max-height: 180px; padding: 11px 12px; border-radius: 12px;
             border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #send { height: 44px; min-width: 76px; }
  #send.stop { background: var(--danger); }
  .note { max-width: 820px; margin: 6px auto 0; text-align: center; font-size: 12px; color: var(--muted); }
  .error { color: var(--danger); }
  @media (max-width: 560px) { .brand span, .lbl { display: none; } header { gap: 8px; padding: 8px 12px; } main { padding: 12px; } .bubble { max-width: 94%; } }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">K</div>
  <div class="brand"><b>Kairos</b><span>AI assistant by Abhimanyu</span></div>
  <div class="spacer"></div>
  <select id="model" aria-label="Choose Kairos model">
    <option value="onnx-community/Qwen2.5-1.5B-Instruct" data-size="~1 GB">Kairos (smart)</option>
    <option value="onnx-community/Qwen2.5-0.5B-Instruct" data-size="~0.5 GB">Kairos Lite (fast)</option>
  </select>
  <button class="icon-btn" id="theme" title="Light / dark" aria-label="Toggle light or dark theme">◐</button>
  <button class="icon-btn" id="newchat" title="New chat" aria-label="New chat">＋<span class="lbl"> New</span></button>
</header>

<main id="main">
  <div class="wrap" id="chat">
    <section class="welcome" id="welcome">
      <div class="logo big">K</div>
      <h1>Kairos</h1>
      <p>Your AI assistant, created by Abhimanyu.</p>
      <p class="small">Runs privately on your device — your messages never leave your browser.</p>
      <div class="card" id="loader">
        <div id="loadText"><b>Start Kairos</b><br><span class="small" id="sizeNote"></span></div>
        <div class="bar" id="barWrap" hidden><i id="bar"></i></div>
        <div class="small" id="status"></div>
        <div style="margin-top:12px"><button class="primary" id="start">Start Kairos</button></div>
      </div>
      <div class="chips" id="chips" hidden>
        <button class="chip">Who are you?</button>
        <button class="chip">Write a Python function to reverse a string</button>
        <button class="chip">Explain black holes simply</button>
        <button class="chip">Write a short poem about the monsoon</button>
        <button class="chip">I'm stressed about my exams</button>
      </div>
    </section>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Start Kairos above, then type a message…" disabled></textarea>
    <button class="primary" id="send" disabled>Send</button>
  </div>
  <div class="note">Kairos can make mistakes. Check important info.</div>
</footer>

<script type="module">
const SYSTEM_PROMPT =
  "You are Kairos, a friendly and helpful AI assistant created by Abhimanyu, the founder of Kairos. " +
  "You are not Claude, ChatGPT, Gemini or any OpenAI or Anthropic model. " +
  "If asked what you are built on, say Abhimanyu built you on the open-source Qwen model. " +
  "You chat naturally, write clean working code with short explanations, solve problems step by step, " +
  "and write creative stories and poems. Follow the user's requested format and length exactly. " +
  "Be warm and supportive when someone is going through a hard time. If someone mentions suicide, " +
  "self-harm or not wanting to live, respond with care, encourage them to reach out to someone they trust, " +
  "and always share these helplines: in India, Tele-MANAS 14416 (free, 24/7) or 112 for emergencies; " +
  "elsewhere, their local emergency number or a crisis helpline. You are not a doctor or therapist.";
const HISTORY_SIZE = 10;

const $ = (id) => document.getElementById(id);
const el = { main: $("main"), chat: $("chat"), welcome: $("welcome"), loader: $("loader"), status: $("status"),
  bar: $("bar"), barWrap: $("barWrap"), start: $("start"), chips: $("chips"), input: $("input"), send: $("send"),
  model: $("model"), sizeNote: $("sizeNote"), theme: $("theme"), newchat: $("newchat") };

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const qs = new URLSearchParams(location.search);
const worker = new Worker(new URL("./worker.js" + (qs.get("fake") === "1" ? "?fake=1" : ""), import.meta.url), { type: "module" });

let history = store.get("kairos.history", []);
let ready = false, busy = false, currentBubble = null, currentText = "";

// ---------- theme ----------
const savedTheme = store.get("kairos.theme", null);
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
el.theme.onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const now = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = now === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  store.set("kairos.theme", next);
};

// ---------- device detection ----------
async function detect() {
  try {
    if (navigator.gpu) {
      const adapter = await navigator.gpu.requestAdapter();
      if (adapter) return { device: "webgpu", dtype: adapter.features.has("shader-f16") ? "q4f16" : "q4" };
    }
  } catch {}
  return { device: "wasm", dtype: "q4" };
}
let hw = { device: "wasm", dtype: "q4" };
const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

function updateSizeNote() {
  const opt = el.model.selectedOptions[0];
  const speed = hw.device === "webgpu" ? "uses your GPU (fast)" : "no WebGPU found — runs on CPU (slower)";
  el.sizeNote.textContent = `One-time download ${opt.dataset.size}, then cached. ${speed}.`;
}

detect().then((d) => {
  hw = d;
  const saved = store.get("kairos.model", null);
  if (saved && [...el.model.options].some((o) => o.value === saved)) el.model.value = saved;
  else if (hw.device !== "webgpu" || mobile) el.model.value = "onnx-community/Qwen2.5-0.5B-Instruct";
  updateSizeNote();
});

el.model.onchange = () => {
  store.set("kairos.model", el.model.value);
  updateSizeNote();
  if (ready || busy) {
    ready = false; setComposer(false);
    el.welcome.hidden = false; el.loader.hidden = false; el.start.disabled = false; el.start.textContent = "Load this model";
    el.status.textContent = ""; el.barWrap.hidden = true;
  }
};

// ---------- loading ----------
el.start.onclick = () => {
  el.start.disabled = true;
  el.start.textContent = "Loading…";
  el.barWrap.hidden = false;
  el.status.textContent = "Downloading Kairos… (only the first time)";
  worker.postMessage({ type: "load", model: el.model.value, device: hw.device, dtype: hw.dtype });
};

const mb = (b) => (b / 1e6).toFixed(0);
worker.onmessage = (e) => {
  const m = e.data;
  if (m.type === "progress") {
    el.bar.style.width = `${Math.min(100, m.percent).toFixed(1)}%`;
    el.status.textContent = m.total ? `Downloading… ${mb(m.loaded)} / ${mb(m.total)} MB` : "Downloading…";
  } else if (m.type === "warming") {
    el.bar.style.width = "100%";
    el.status.textContent = "Preparing Kairos…";
  } else if (m.type === "ready") {
    ready = true;
    el.loader.hidden = true;
    el.chips.hidden = history.length > 0;
    setComposer(true);
    el.input.focus();
  } else if (m.type === "token") {
    currentText += m.text;
    renderBot(currentBubble, currentText, true);
    scrollDown();
  } else if (m.type === "done") {
    finishReply();
  } else if (m.type === "error") {
    if (busy) {
      currentText += `\n\n⚠️ ${m.message}`;
      finishReply();
    } else {
      el.status.innerHTML = `<span class="error">Couldn't start Kairos: ${escapeHtml(m.message)}</span><br>` +
        `Try <b>Kairos Lite</b>, or use Chrome / Edge on a laptop.`;
      el.start.disabled = false; el.start.textContent = "Try again";
    }
  }
};

// ---------- chat ----------
function setComposer(on) {
  el.input.disabled = !on;
  el.send.disabled = !on;
  el.input.placeholder = on ? "Message Kairos…" : "Start Kairos above, then type a message…";
}

function scrollDown() { el.main.scrollTop = el.main.scrollHeight; }

function addMessage(role, text) {
  const row = document.createElement("div");
  row.className = `msg ${role === "user" ? "user" : "bot"}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (role === "user") bubble.textContent = text;
  else renderBot(bubble, text, false);
  row.appendChild(bubble);
  el.chat.appendChild(row);
  scrollDown();
  return bubble;
}

function send(text) {
  text = (text ?? el.input.value).trim();
  if (!text || !ready || busy) return;
  el.input.value = ""; autosize();
  el.welcome.hidden = true;
  history.push({ role: "user", content: text });
  addMessage("user", text);
  currentText = "";
  currentBubble = addMessage("assistant", "");
  renderBot(currentBubble, "", true);
  busy = true;
  el.send.textContent = "Stop"; el.send.classList.add("stop");
  const messages = [{ role: "system", content: SYSTEM_PROMPT }, ...history.slice(-HISTORY_SIZE)];
  worker.postMessage({ type: "generate", messages, maxTokens: 700 });
}

function finishReply() {
  busy = false;
  const text = currentText.trim() || "…";
  renderBot(currentBubble, text, false);
  history.push({ role: "assistant", content: text });
  store.set("kairos.history", history.slice(-40));
  el.send.textContent = "Send"; el.send.classList.remove("stop");
  el.input.focus();
}

el.send.onclick = () => (busy ? worker.postMessage({ type: "stop" }) : send());
el.input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!busy) send(); }
});
function autosize() { el.input.style.height = "auto"; el.input.style.height = Math.min(el.input.scrollHeight, 180) + "px"; }
el.input.addEventListener("input", autosize);
el.chips.addEventListener("click", (e) => { if (e.target.classList.contains("chip")) send(e.target.textContent); });

el.newchat.onclick = () => {
  if (busy) worker.postMessage({ type: "stop" });
  history = []; store.set("kairos.history", []);
  [...el.chat.querySelectorAll(".msg")].forEach((n) => n.remove());
  el.welcome.hidden = false;
  el.welcome.classList.remove("compact");
  el.chips.hidden = !ready;
};

// restore previous chat (start card shown compact above it)
if (history.length) {
  history.forEach((m) => addMessage(m.role, m.content));
  el.welcome.classList.add("compact");
}

// ---------- tiny, safe markdown (escape first, then format) ----------
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function inline(s) {
  return s
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, "$1<i>$2</i>");
}
function toHtml(text) {
  const parts = text.split(/```/);
  return parts.map((part, i) => {
    if (i % 2 === 1) {                                     // code block
      const nl = part.indexOf("\n");
      const code = nl >= 0 && /^[\w+#.-]*$/.test(part.slice(0, nl).trim()) ? part.slice(nl + 1) : part;
      return `<pre><button class="copy">Copy</button><code>${escapeHtml(code.replace(/\n$/, ""))}</code></pre>`;
    }
    return escapeHtml(part).split(/\n{2,}/).filter((p) => p.trim())
      .map((p) => `<p>${inline(p).replace(/\n/g, "<br>")}</p>`).join("");
  }).join("");
}
function renderBot(bubble, text, typing) {
  bubble.innerHTML = `<div class="who">Kairos</div><div class="${typing ? "cursor" : ""}">${toHtml(text)}</div>`;
}
el.chat.addEventListener("click", (e) => {
  if (!e.target.classList.contains("copy")) return;
  const code = e.target.parentElement.querySelector("code").textContent;
  navigator.clipboard?.writeText(code).then(() => { e.target.textContent = "Copied!"; setTimeout(() => (e.target.textContent = "Copy"), 1200); });
});
</script>
</body>
</html>
